<section class="admin-login">
  <form class="admin-login__card" (ngSubmit)="ingresar()">
    <h1>Panel de administración</h1>

    <p class="admin-login__demo" role="note">
      Este es un entorno de demostración. Los datos ya están cargados: solo presioná <strong>Ingresar</strong>.
    </p>

    <label>
      Usuario
      <input type="text" name="usuario" autocomplete="username" [(ngModel)]="usuario" required />
    </label>
    <label>
      Contraseña
      <input type="password" name="password" autocomplete="current-password" [(ngModel)]="password" required />
    </label>

    @if (error(); as mensajeError) {
      <p class="admin-login__error">{{ mensajeError }}</p>
    }

    <button type="submit" class="btn btn--primario btn--grande" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</section>
